<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="shortcut icon" href="./habeeb-modified.png" type="image/x-icon">
</head>
<body>
    <h2>Contact Page</h2>
<form>
<div>
    <label for="Name">Name;</label>
    <br>
    <input type="text" placeholder="Enter your Full Name">
</div>
<br>
<div>
    <label for="Email">Email;</label>
    <br>
    <input type="text" placeholder="Enter your Email Address">
</div>
<div>
    <br>
    <label for="Number">Phone Number;</label>
    <br>
    <input type="number" placeholder="Enter your phone number">
</div>
<br>
<div>
<label for="gender">Gender:</label>
<br>
<input type="radio" name="gender">Male
<br>
<input type="radio" name="gender">Female
<br>
<input type="radio" name="gender">Prefer not to say
</div>
<br>
<div>
    <label for="pcm">Preferred Contact Method</label>
    <br>
    <select name="Preferred Contact Method" id="Preferred Contact Method">
        <option value="scm">Select Contact Method</option>
        <option value="Number">Number</option>
        <option value="Email">Email</option>
        <option value="Chat">Chat</option>
    </select>
</div>
<br>
<div>
    <label for="Message">Message;</label>
    <br>
    <textarea name="" id="" cols="20" rows="5" placeholder="Enter your Message here...."></textarea>
</div>
<button type="submit">Submit</button>
</body>
</html>
